<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo - Widget GProA Gemini embebido</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .header {
            background: linear-gradient(135deg, #00e0ff, #8a2be2);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2rem;
        }
        .contenido {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .tarjeta {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .tarjeta h2 {
            color: #0a0f1c;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mi Sitio Web - GProA</h1>
        <p>Con asistente de IA integrado</p>
    </div>
    
    <div class="contenido">
        <div class="tarjeta">
            <h2>Bienvenido a nuestro sitio</h2>
            <p>Aquí puedes ver el widget de GProA Gemini integrado en la esquina inferior derecha.</p>
        </div>
    </div>

    <!-- WIDGET DE GPROA GEMINI -->
    <!-- Simplemente incluye este script en tu página y el widget aparecerá -->
    <script src="widget/js/widget.js"></script>
</body>
</html>
